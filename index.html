<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NovaTask - A sleek, modern, and aesthetic task management to-do application with local storage persistence.">
  <title>NovaTask — Modern To-Do & Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <!-- Dynamic Background Glow Elements -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>
  <div class="ambient-glow glow-3" aria-hidden="true"></div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="logo-title">NovaTask</h1>
          <p class="logo-subtitle">Plan your day, master your flow</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Sound Effect Toggle -->
        <button id="toggle-sound-btn" class="icon-btn" title="Toggle Sound Effects" aria-label="Toggle Sound Effects">
          <svg class="sound-on-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg class="sound-off-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="sun-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Stats Card Dashboard -->
    <section class="stats-card">
      <div class="stats-content">
        <div class="stats-text">
          <span class="stats-greeting" id="date-display">Today</span>
          <h2 class="stats-headline" id="stats-headline">Let's make today productive!</h2>
          <p class="stats-subtitle" id="stats-subtitle">You have 0 tasks completed</p>
        </div>
        <div class="progress-ring-container">
          <svg class="progress-ring" width="84" height="84" viewBox="0 0 84 84">
            <circle class="progress-ring-track" cx="42" cy="42" r="36" />
            <circle class="progress-ring-fill" id="progress-circle" cx="42" cy="42" r="36" />
          </svg>
          <div class="progress-text">
            <span id="progress-percent">0%</span>
          </div>
        </div>
      </div>

      <div class="quick-stats-row">
        <div class="quick-stat-item">
          <span class="stat-number" id="total-tasks-count">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="quick-stat-divider"></div>
        <div class="quick-stat-item">
          <span class="stat-number" id="active-tasks-count">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="quick-stat-divider"></div>
        <div class="quick-stat-item">
          <span class="stat-number" id="completed-tasks-count">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="quick-stat-divider"></div>
        <div class="quick-stat-item">
          <span class="stat-number text-urgent" id="overdue-tasks-count">0</span>
          <span class="stat-label">Overdue</span>
        </div>
      </div>
    </section>

    <!-- Task Input Form -->
    <section class="task-input-section">
      <form id="task-form" class="task-form" autocomplete="off">
        <div class="input-main-row">
          <div class="input-field-wrapper">
            <span class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
              </svg>
            </span>
            <input 
              type="text" 
              id="task-title-input" 
              placeholder="What needs to be accomplished?" 
              maxlength="120"
              required
              aria-label="New task title"
            >
          </div>
          <button type="submit" id="add-task-btn" class="primary-btn">
            <span>Add Task</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>

        <!-- Task Metadata Options -->
        <div class="input-options-row">
          <!-- Priority Selector -->
          <div class="option-group">
            <label for="task-priority-select" class="option-label">Priority</label>
            <select id="task-priority-select" class="select-input">
              <option value="low">🌱 Low</option>
              <option value="medium" selected>⚡ Medium</option>
              <option value="high">🔥 High</option>
            </select>
          </div>

          <!-- Category Selector -->
          <div class="option-group">
            <label for="task-category-select" class="option-label">Category</label>
            <select id="task-category-select" class="select-input">
              <option value="Work">💼 Work</option>
              <option value="Personal" selected>👤 Personal</option>
              <option value="Study">📚 Study</option>
              <option value="Health">🧘 Health</option>
              <option value="Finance">💰 Finance</option>
            </select>
          </div>

          <!-- Due Date -->
          <div class="option-group">
            <label for="task-due-date" class="option-label">Due Date</label>
            <input type="date" id="task-due-date" class="date-input">
          </div>
        </div>
      </form>
    </section>

    <!-- Toolbar: Search, Filters, and Sorting -->
    <section class="toolbar-section">
      <!-- Search Input -->
      <div class="search-bar">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search tasks..." aria-label="Search tasks">
        <button id="clear-search-btn" class="clear-search-btn hidden" aria-label="Clear search">×</button>
      </div>

      <!-- Filter Tabs -->
      <div class="filter-tabs-wrapper">
        <div class="filter-tabs" role="tablist">
          <button class="tab-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
          <button class="tab-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
          <button class="tab-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
          <button class="tab-btn" data-filter="high-priority" role="tab" aria-selected="false">High Priority</button>
        </div>

        <div class="sort-control">
          <label for="sort-select" class="sr-only">Sort by</label>
          <select id="sort-select" class="sort-select" aria-label="Sort tasks">
            <option value="date-new">Date: Newest</option>
            <option value="date-old">Date: Oldest</option>
            <option value="priority-desc">Priority: High → Low</option>
            <option value="due-soon">Due Date: Soonest</option>
            <option value="alphabetical">Name: A → Z</option>
          </select>
        </div>
      </div>

      <!-- Category Filter Pills -->
      <div class="category-pills" id="category-pills">
        <button class="category-pill active" data-category="all">All Tags</button>
        <button class="category-pill" data-category="Work">💼 Work</button>
        <button class="category-pill" data-category="Personal">👤 Personal</button>
        <button class="category-pill" data-category="Study">📚 Study</button>
        <button class="category-pill" data-category="Health">🧘 Health</button>
        <button class="category-pill" data-category="Finance">💰 Finance</button>
      </div>
    </section>

    <!-- Task List Section -->
    <main class="tasks-section">
      <div class="tasks-header">
        <h3 id="current-view-title" class="current-view-title">All Tasks</h3>
        <div class="bulk-actions">
          <button id="mark-all-done-btn" class="bulk-btn" title="Toggle all tasks completion">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Mark All Done</span>
          </button>
          <button id="clear-completed-btn" class="bulk-btn text-danger" title="Remove all completed tasks">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Clear Completed</span>
          </button>
        </div>
      </div>

      <ul id="task-list" class="task-list" aria-label="Task list">
        <!-- Rendered dynamically by JavaScript -->
      </ul>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-state-art">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <path d="M9 15l2 2 4-4"></path>
          </svg>
        </div>
        <h4 class="empty-title">No tasks found</h4>
        <p class="empty-desc">Your task list is clear! Enjoy the moment or add a new goal above.</p>
      </div>
    </main>

    <!-- Footer & Utilities -->
    <footer class="app-footer">
      <div class="footer-left">
        <span class="storage-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          </svg>
          Local Storage Synchronized
        </span>
      </div>
      <div class="footer-right">
        <button id="export-btn" class="footer-link-btn" title="Export tasks as JSON file">Export Data</button>
        <span class="footer-dot">•</span>
        <label for="import-file" class="footer-link-btn" title="Import tasks from JSON file">Import</label>
        <input type="file" id="import-file" accept=".json" class="hidden">
        <span class="footer-dot">•</span>
        <button id="reset-sample-btn" class="footer-link-btn" title="Load sample demo tasks">Load Samples</button>
      </div>
    </footer>
  </div>

  <!-- Edit Task Modal Dialog (Modern native HTML dialog with platform controls) -->
  <dialog id="edit-modal" class="modal-dialog">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Edit Task</h3>
        <button id="close-modal-btn" class="modal-close-btn" aria-label="Close edit modal">✕</button>
      </div>
      <form id="edit-form" class="modal-form">
        <input type="hidden" id="edit-task-id">
        
        <div class="form-group">
          <label for="edit-task-title" class="modal-label">Task Name</label>
          <input type="text" id="edit-task-title" class="modal-input" required maxlength="120">
        </div>

        <div class="modal-grid">
          <div class="form-group">
            <label for="edit-task-priority" class="modal-label">Priority</label>
            <select id="edit-task-priority" class="modal-select">
              <option value="low">🌱 Low</option>
              <option value="medium">⚡ Medium</option>
              <option value="high">🔥 High</option>
            </select>
          </div>

          <div class="form-group">
            <label for="edit-task-category" class="modal-label">Category</label>
            <select id="edit-task-category" class="modal-select">
              <option value="Work">💼 Work</option>
              <option value="Personal">👤 Personal</option>
              <option value="Study">📚 Study</option>
              <option value="Health">🧘 Health</option>
              <option value="Finance">💰 Finance</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="edit-task-due" class="modal-label">Due Date</label>
          <input type="date" id="edit-task-due" class="modal-input">
        </div>

        <div class="modal-actions">
          <button type="button" id="cancel-edit-btn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
